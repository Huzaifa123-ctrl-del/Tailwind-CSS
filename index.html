<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Login Page</title>
</head>

<body class="bg-gray-100">
  <div class="container mt-48 flex mx-auto items-center justify-center">
    <div class="left w-1/2 mx-14">
      <img src="./src/images/facebook.png" class="w-60" alt="Facebook Image">
      <p class="text-3xl">Facebook helps you connect and share with the people in your life.</p>
    </div>
    <div class="right flex flex-col bg-white p-8 rounded-xl w-1/3 text-lg relative shadow-2xl">
      <input class="px-4 h-12 my-2 outline-blue-600 border border-gray-200 rounded-lg" type="email" placeholder="Email Address or Phone number">
      <input class="px-4 h-12 my-2 outline-blue-600 border border-gray-200 rounded-lg" type="password" placeholder="Password">
      <button class="bg-blue-600 hover:bg-blue-700 text-white my-2 py-3 rounded-md font-bold text-xl">Login</button>
      <span class="text-blue-600 text-center text-sm my-2 cursor-pointer hover:underline">Forgotten Password?</span>
      <hr class="my-2">
      <button class="bg-green-600 hover:bg-green-700 text-white my-2 py-3 px-4 m-auto rounded-md font-bold text-xl w-fit">Create New account</button>
      <span class="absolute -bottom-10"><span class="font-bold cursor-pointer hover:underline">Create a page</span> for celebrity, brand or business</span>
    </div>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>

</html>
